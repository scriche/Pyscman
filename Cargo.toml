[package]
name = "pyscman"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.18.1"
actix-files = "0.7.2"
actix-cors = "0.7.2"
actix-ws = "0.4.0"
actix = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
threadpool = "1.8.1"
log = "0.4.34"
env_logger = "0.11.11"
actix-multipart = "0.8.5"
sanitize-filename = "0.6.0"
zip = "9.1.3"